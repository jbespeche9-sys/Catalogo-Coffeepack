<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coffeepack Catalogo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Coffeepack inicio">
          <img src="assets/coffeepack-logo.png" alt="Coffee Pack" />
        </a>
        <a class="quote-button" href="https://wa.me/5491143997557" target="_blank" rel="noopener">Cotizar</a>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <h1 id="page-title">Coffeepack</h1>
      </section>

      <main id="catalogo" class="catalog-layout">
        <aside id="filtros" class="filters" aria-label="Filtros del catalogo">
          <div class="filter-search">
            <label class="search-label" for="searchInput">Buscar</label>
            <input id="searchInput" class="search-input" type="search" placeholder="Producto, material o tipo" />
          </div>

          <div class="filter-header">
            <h2>Filtros</h2>
            <button id="clearFilters" class="text-button" type="button">Limpiar</button>
          </div>

          <section class="filter-group">
            <label class="select-label" for="typeSelect">Tipo de producto</label>
            <select id="typeSelect" class="filter-select"></select>
          </section>

          <section class="filter-group">
            <label class="select-label" for="materialSelect">Material</label>
            <select id="materialSelect" class="filter-select"></select>
          </section>

          <section class="filter-group">
            <label class="select-label" for="personalizedSelect">Personalizable</label>
            <select id="personalizedSelect" class="filter-select">
              <option value="all">Todos</option>
              <option value="yes">Personalizable</option>
              <option value="no">No personalizable</option>
            </select>
          </section>
        </aside>

        <section class="products-panel" aria-labelledby="products-title">
          <div class="products-heading">
            <div>
              <p class="eyebrow">All products</p>
              <h2 id="products-title">Productos</h2>
            </div>
            <div class="sort-control">
              <span id="shownProducts">Mostrando 0</span>
              <select id="sortSelect" aria-label="Ordenar productos">
                <option value="name">Nombre</option>
                <option value="type">Tipo</option>
                <option value="material">Material</option>
              </select>
            </div>
          </div>

          <div id="productsGrid" class="products-grid"></div>
          <div id="emptyState" class="empty-state" hidden>
            <h3>No hay productos con esos filtros</h3>
            <p>Probá ajustar la busqueda o limpiar los filtros.</p>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js" type="module"></script>
  </body>
</html>
